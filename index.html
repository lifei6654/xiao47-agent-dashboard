<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 Agent 监控台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 24px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { font-size: 28px; color: #1a1a1a; }
    .header .controls { display: flex; gap: 12px; align-items: center; }
    
    .filter-btn { padding: 8px 16px; border: 1px solid #d9d9d9; border-radius: 6px; background: white; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .filter-btn:hover { border-color: #1890ff; color: #1890ff; }
    .filter-btn.active { background: #1890ff; color: white; border-color: #1890ff; }
    
    .stats { display: flex; gap: 16px; margin-bottom: 24px; }
    .stat-card { background: white; padding: 16px 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .label { color: #8c8c8c; font-size: 14px; }
    .stat-card .value { font-size: 24px; font-weight: 600; color: #1a1a1a; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    
    .agent-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s; }
    .agent-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    
    .agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .agent-name { font-size: 18px; font-weight: 600; color: #1a1a1a; }
    .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .status-running { background: #e6f7ff; color: #1890ff; }
    .status-idle { background: #f6ffed; color: #52c41a; }
    .status-error { background: #fff2f0; color: #ff4d4f; }
    
    .agent-info { color: #595959; font-size: 14px; line-height: 1.8; }
    .agent-info .label { color: #8c8c8c; }
    
    .footer { margin-top: 24px; text-align: center; color: #8c8c8c; font-size: 13px; }
    .footer .refresh-btn { margin-left: 12px; padding: 4px 12px; border: 1px solid #d9d9d9; border-radius: 4px; background: white; cursor: pointer; }
    
    .empty-state { text-align: center; padding: 60px; color: #8c8c8c; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Agent 监控台</h1>
    <div class="controls">
      <button class="filter-btn active" data-type="全部">全部</button>
      <button class="filter-btn" data-type="文档处理">文档处理</button>
      <button class="filter-btn" data-type="数据查询">数据查询</button>
      <button class="filter-btn" data-type="浏览器操作">浏览器操作</button>
      <button class="filter-btn" data-type="消息通知">消息通知</button>
    </div>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <div class="label">总Agent数</div>
      <div class="value" id="totalCount">-</div>
    </div>
    <div class="stat-card">
      <div class="label">运行中</div>
      <div class="value" id="runningCount">-</div>
    </div>
    <div class="stat-card">
      <div class="label">闲置</div>
      <div class="value" id="idleCount">-</div>
    </div>
    <div class="stat-card">
      <div class="label">异常</div>
      <div class="value" id="errorCount">-</div>
    </div>
  </div>
  
  <div class="grid" id="agentGrid"></div>
  
  <div class="footer">
    <span>最后更新：<span id="lastUpdate">-</span></span>
    <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
  </div>

  <script>
    const DATA_URL = 'https://raw.githubusercontent.com/lifei6654/xiao47-agent-dashboard/main/data/dashboard-data.json';
    let allAgents = [];
    let currentFilter = '全部';

    async function loadData() {
      try {
        const res = await fetch(DATA_URL + '?t=' + Date.now());
        const data = await res.json();
        allAgents = data.agents || [];
        render();
        document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
      } catch (e) {
        console.error(e);
        document.getElementById('agentGrid').innerHTML = '<div class="empty-state">暂无数据 - 请确保OpenClaw正在推送数据</div>';
      }
    }

    function render() {
      const filtered = currentFilter === '全部' ? allAgents : allAgents.filter(a => a.type === currentFilter);
      
      // 更新统计
      document.getElementById('totalCount').textContent = allAgents.length;
      document.getElementById('runningCount').textContent = allAgents.filter(a => a.status === 'running').length;
      document.getElementById('idleCount').textContent = allAgents.filter(a => a.status === 'idle').length;
      document.getElementById('errorCount').textContent = allAgents.filter(a => a.status === 'error').length;
      
      // 更新卡片
      const grid = document.getElementById('agentGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">暂无该类型的Agent</div>';
        return;
      }
      
      grid.innerHTML = filtered.map(agent => `
        <div class="agent-card">
          <div class="agent-header">
            <span class="agent-name">${agent.name}</span>
            <span class="status-badge status-${agent.status}">${agent.status === 'running' ? '运行中' : agent.status === 'idle' ? '闲置' : '异常'}</span>
          </div>
          <div class="agent-info">
            <div><span class="label">类型：</span>${agent.type}</div>
            <div><span class="label">当前任务：</span>${agent.currentTask}</div>
            <div><span class="label">运行时长：</span>${agent.startedAt}</div>
            <div><span class="label">模型：</span>${agent.model}</div>
          </div>
        </div>
      `).join('');
      
      // 更新按钮状态
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === currentFilter);
      });
    }

    // 绑定筛选按钮
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => { currentFilter = btn.dataset.type; render(); };
    });

    // 初始加载
    loadData();
    
    // 每30秒自动刷新
    setInterval(loadData, 30000);
  </script>
</body>
</html>
